<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实验室离心机预约台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>🧪 实验室离心机预约台</h1>
    <p class="sub">
      4 台离心机 · 转子 A（24 管，适配 1/2 号机）· 转子 B（12 管，适配全部机台）·
      数据保存在本机浏览器，重开不丢失
    </p>
  </header>

  <main>
    <section class="panel" id="booking-panel">
      <h2>登记样本</h2>
      <form id="booking-form">
        <label>样本名称
          <input type="text" name="sampleName" required placeholder="如：血样-20260925-01">
        </label>
        <label>送样人
          <input type="text" name="owner" required placeholder="姓名">
        </label>
        <div class="row">
          <label>管数
            <input type="number" name="tubes" min="1" step="1" required placeholder="≤24">
          </label>
          <label>时长（分钟）
            <input type="number" name="minutes" min="5" step="5" required placeholder="如 30">
          </label>
        </div>
        <label>优先级
          <select name="priority">
            <option value="normal">普通</option>
            <option value="urgent">急样（可顶掉普通预约）</option>
          </select>
        </label>
        <label>期望开始时间
          <input type="datetime-local" name="start" required>
        </label>
        <label>完成期限
          <input type="datetime-local" name="deadline" required>
        </label>
        <button type="submit" class="primary">提交预约</button>
      </form>
      <div id="message" class="msg"></div>
    </section>

    <section class="panel">
      <h2>机台排期</h2>
      <div id="board" class="grid machines"></div>
      <h2>转子占用</h2>
      <div id="rotor-board" class="grid rotors"></div>
      <p class="legend"><span class="dot urgent"></span>急样　<span class="dot normal"></span>普通　灰色为已结束</p>
    </section>
  </main>

  <script src="js/store.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
